apiVersion: 1

# Stable UIDs (prometheus, tempo, loki) so the dashboard JSON in assets/grafana references datasources portably.
# "$$" escapes Grafana's environment-variable expansion so the literal "$" reaches the datasource.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://crawlsharp-prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://crawlsharp-tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        customQuery: true
        query: '{service_name="crawlsharp-server"} | trace_id="$${__span.traceId}"'

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://crawlsharp-loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
